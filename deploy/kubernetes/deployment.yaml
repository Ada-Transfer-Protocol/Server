# AdaTP server Deployment.
#
# TLS NOTE: the server speaks plain HTTP/WebSocket on :3000 by design. It does
# NOT terminate TLS. Put an Ingress / gateway / service mesh in front of it to
# terminate TLS (wss://) and forward to this Service — TLS is REQUIRED in
# production because the AdaTP session handshake is unauthenticated on its own
# (see docs/production/security-hardening.md). The Ingress MUST allow the
# WebSocket upgrade and long-lived connections (raise idle/read timeouts above
# the server's ping interval).
#
# SINGLE REPLICA: rooms and connections are in-process. Two replicas would be
# two unrelated servers behind one Service. Keep replicas: 1 and strategy
# Recreate (the SQLite PVC is ReadWriteOnce). Scaling out needs app-level
# sharding — see docs/production/ha.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adatp-server
  labels:
    app.kubernetes.io/name: adatp-server
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: adatp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adatp-server
        app.kubernetes.io/component: server
    spec:
      # The server traps SIGTERM and drains gracefully (flushes Disconnect
      # frames). Give it room before SIGKILL.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adatp-server
          # Built from the repo-root Dockerfile:
          #   docker build -t adatp-server:1.0.0 .
          #   docker tag adatp-server:1.0.0 registry.example.com/adatp/adatp-server:1.0.0
          #   docker push registry.example.com/adatp/adatp-server:1.0.0
          # Then pin the immutable tag (or digest) here.
          image: adatp-server:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: adatp-config
            - secretRef:
                name: adatp-secrets
          # Liveness: is the process up and serving? /healthz needs no auth
          # and no DB.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: /readyz returns 503 when the DB is unreachable or the
          # server is draining, so the Service stops routing during rollouts.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Startup: don't let liveness kill a slow first boot.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              # A CPU limit can throttle a latency-sensitive fan-out server;
              # remove it if you see throttling under load.
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # SQLite writes to the mounted /app/data volume, so the root
            # filesystem can be tightened to read-only if desired:
            #   readOnlyRootFilesystem: true
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: adatp-data
