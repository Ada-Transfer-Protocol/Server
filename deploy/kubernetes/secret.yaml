# Secret env for the AdaTP server.
#
# ADMIN_TOKEN authenticates the /admin/v1/* control plane (x-admin-token
# header). If it is unset the server generates a random one and prints it to
# the log once — fine for a throwaway pod, useless for real operations, so set
# it explicitly here.
#
# Do NOT commit a real token. Replace the placeholder below, or (better)
# create the Secret out of band and delete this file from your manifests:
#
#   kubectl create secret generic adatp-secrets \
#     --from-literal=ADMIN_TOKEN="$(openssl rand -hex 32)"
#
apiVersion: v1
kind: Secret
metadata:
  name: adatp-secrets
  labels:
    app.kubernetes.io/name: adatp-server
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  ADMIN_TOKEN: "replace-me-with-a-long-random-secret"
